name: Publish to PyPI

# Triggered by pushing a git tag that starts with `v` (e.g. v0.1.0).
# Uses PyPI's Trusted Publisher (OIDC) flow -- no API tokens needed.
#
# One-time PyPI setup (required before the first release can succeed):
#   1. Create an account at https://pypi.org
#   2. Go to Your projects -> Publishing -> Add a pending publisher with:
#        PyPI project name:    eml-translator
#        Owner:                ElMatiOfficial
#        Repository name:      EML-Matemathical-Translator-for-AI
#        Workflow name:        publish.yml
#        Environment name:     pypi     (optional but recommended)
#   3. (Optional) In this repo, create an Environment called `pypi`
#      under Settings -> Environments, so deploys can be gated.
#
# After setup, release with:
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    # This environment name must match the one configured on PyPI.
    # Delete the `environment:` block if you did not create a PyPI environment.
    environment:
      name: pypi
      url: https://pypi.org/p/eml-translator
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
